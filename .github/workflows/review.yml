# On-demand Claude review for big changes. Idle until you either
#   * add the `claude-review` label to a PR, or
#   * comment `@claude ...` on a PR.
# Needs a CLAUDE_CODE_OAUTH_TOKEN repo secret (from `claude setup-token`); without it the
# job skips itself.
name: Claude review

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'claude-review') ||
      (github.event_name != 'pull_request' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    uses: buildthehomelab/wow-ci/.github/workflows/review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit
